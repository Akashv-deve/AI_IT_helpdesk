name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests main.py app.py

      - name: Test
        # HELPDESK_OFFLINE keeps CI green without an Ollama server on the runner.
        env:
          HELPDESK_OFFLINE: "1"
        run: pytest --cov --cov-report=term-missing

      - name: Smoke-test the CLI
        env:
          HELPDESK_OFFLINE: "1"
        run: |
          python main.py doctor || true
          python main.py ask "my wifi keeps dropping" --offline
          python main.py mcp-check

      - name: Smoke-test the web app
        env:
          HELPDESK_OFFLINE: "1"
        # AppTest runs the real Streamlit script and fails on any render error.
        run: pytest tests/test_web.py -q
