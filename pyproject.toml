[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-it-helpdesk"
version = "1.0.0"
description = "An agentic IT helpdesk: LangGraph routing, MCP tools, a local Ollama model and SQLite memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["langgraph", "mcp", "ollama", "agent", "helpdesk", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2,<2.0",
    "langchain-core>=0.3,<2.0",
    "langchain-ollama>=0.2,<2.0",
    "mcp>=1.0,<3.0",
    "rich>=13.0,<16.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.36,<2.0",
    "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
helpdesk = "helpdesk.cli:main"
helpdesk-mcp = "helpdesk.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["helpdesk*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["src/helpdesk"]
